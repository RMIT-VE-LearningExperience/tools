<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logbook — spoken and filmed evidence</title>
<style>
:root{
  --sky:#F2F7FA; --sky-2:#E7F0F5; --paper:#FFFFFF;
  --ink:#132430; --ink-2:#2C4454; --muted:#607C8D;
  --rule:#D5E3EB; --rule-2:#BFD4DF;
  --live:#A65214; --live-bg:#FDF0E4;
  --tagged:#0A6A60; --tagged-bg:#E4F4F1;
  --rec:#B3261E; --rec-bg:#FCEAE8;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--sky);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

.brand{display:flex;align-items:center;gap:18px}
.mark{width:64px;height:84px;flex:none;display:block}
.mark .tower{fill:var(--rule-2)}
.mark .blade{fill:var(--tagged);opacity:.9}
.mark .hub{fill:var(--ink)}
.rotor{transform-box:view-box;transform-origin:50px 34px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rotor{animation:none}}

.masthead{border-bottom:1px solid var(--rule);padding:22px 28px 18px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;background:rgba(255,255,255,.8)}
h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:750;letter-spacing:-.035em;text-transform:uppercase;line-height:.95}
h1 span{color:var(--tagged)}
.tagline{margin:8px 0 0;color:var(--ink-2);font-size:13.5px;max-width:58ch}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2);padding:7px 12px;border-radius:2px}

.wrap{display:grid;grid-template-columns:238px 1fr;min-height:70vh}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
.rail{border-right:1px solid var(--rule);background:rgba(247,251,253,.95);padding:14px 0}
.raillabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 18px 6px}
.stg{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:11px 18px;cursor:pointer;font:inherit;color:var(--muted);border-left:3px solid transparent}
.stg:hover{background:var(--paper)}
.stg[aria-current="true"]{background:var(--paper);border-left-color:var(--tagged);color:var(--ink)}
.stg:focus-visible{outline:2px solid var(--live);outline-offset:-2px}
.stg .id{font-family:var(--mono);font-size:10.5px;width:26px;flex:none;padding-top:2px}
.stg .nm{font-size:13px;line-height:1.35}
.stg .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.main{background:rgba(255,255,255,.93);padding:24px 28px 34px;min-width:0}
h2{font-size:18px;font-weight:750;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 6px}
h3{font-size:13px;font-weight:700;margin:22px 0 6px}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 4px;max-width:70ch;line-height:1.6}
.lede b{color:var(--ink)}

.gate{border-left:3px solid var(--live);background:var(--live-bg);padding:13px 16px;margin:16px 0;font-size:13px;line-height:1.6;max-width:76ch}
.gate b{color:var(--live)}
.note{border-left:3px solid var(--rule-2);background:var(--sky-2);padding:11px 15px;margin:16px 0;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:76ch}
.note b{color:var(--ink)}
.good{border-left:3px solid var(--tagged);background:var(--tagged-bg);padding:11px 15px;margin:16px 0;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:76ch}
.good b{color:var(--tagged)}

label.fl{display:block;font-size:11.5px;color:var(--muted);margin:14px 0 4px}
input[type=text],textarea,select{width:100%;background:var(--paper);border:1px solid var(--rule-2);color:var(--ink);font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:3px;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:2px solid var(--tagged);outline-offset:1px;border-color:var(--tagged)}
textarea{resize:vertical}

button.act{appearance:none;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:3px;cursor:pointer;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);white-space:nowrap}
button.act:hover{border-color:var(--muted)}
button.act.primary{background:var(--tagged);border-color:var(--tagged);color:#fff}
button.act.rec{background:var(--rec);border-color:var(--rec);color:#fff}
button.act.copied{background:var(--tagged);border-color:var(--tagged);color:#fff}
button.act:disabled{opacity:.42;cursor:not-allowed}
button.act:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0;align-items:center}

.recbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:14px 16px;margin-top:16px}
.recbar.on{border-color:var(--rec);background:var(--rec-bg)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--rule-2);flex:none}
.recbar.on .dot{background:var(--rec);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.recbar.on .dot{animation:none}}
.clock{font-family:var(--mono);font-size:17px;letter-spacing:.04em;min-width:66px}
.recbar .st{font-size:12.5px;color:var(--ink-2)}

.cue{border:1px solid var(--rule);border-left:3px solid var(--tagged);background:var(--sky-2);border-radius:3px;padding:14px 16px;margin-top:14px;max-width:76ch}
.cue .q{font-size:15px;line-height:1.5;font-weight:600;margin:0 0 4px}
.cue .n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cuebtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

video,audio{width:100%;max-width:520px;margin-top:14px;border-radius:4px;background:#000;display:block}
audio{background:transparent}

.item{border:1px solid var(--rule);background:var(--paper);border-radius:4px;margin:14px 0;overflow:hidden}
.ihead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:13px 16px;background:var(--sky-2);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.iid{font-family:var(--mono);font-size:11px;color:var(--tagged);font-weight:700;letter-spacing:.06em}
.ititle{font-size:14px;font-weight:650;margin-top:2px}
.imeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
.ibody{padding:14px 16px}
.ibtns{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--rule-2);color:var(--muted)}
.pill.ok{border-color:var(--tagged);color:var(--tagged);background:var(--tagged-bg)}
.pill.no{border-color:var(--live);color:var(--live);background:var(--live-bg)}

pre{margin:16px 0 0;padding:16px 18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;font-family:var(--mono);font-size:12px;line-height:1.68;white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow-y:auto;max-width:96ch}
.empty{color:var(--muted);font-size:13px;padding:24px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>

<header class="masthead">
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 130" aria-hidden="true">
      <path class="tower" d="M46.6 34 h6.8 l3.6 86 h-14 Z"/>
      <path class="tower" d="M36 120 h28 l3 7 h-34 Z"/>
      <g class="rotor">
        <path class="blade" d="M50 34 C 56 26 60 12 58.5 2 C 53 9 49.5 22 47.6 32 Z"/>
        <path class="blade" d="M50 34 C 59 36 73 43 79 51 C 70 51 57 44 48.6 37.4 Z"/>
        <path class="blade" d="M50 34 C 41 36 27 43 21 51 C 30 51 43 44 51.4 37.4 Z"/>
      </g>
      <circle class="hub" cx="50" cy="34" r="4.4"/>
    </svg>
    <div>
      <h1>Log<span>book</span></h1>
      <p class="tagline">Talk through your work instead of writing it up. Records on your machine, transcribes what you said, and produces an evidence index for your assessor.</p>
    </div>
  </div>
  <div class="badge">Local · nothing uploaded</div>
</header>

<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main class="main" id="main"></main>
</div>

<script>
(function(){
"use strict";

var CUES = [
 {t:"What the job was", q:"Describe the task the way you'd explain it to a first-year apprentice. What were you actually doing?"},
 {t:"How often", q:"How many times have you done this? Over what period? Was it routine or a one-off?"},
 {t:"The gear", q:"What equipment — make, model, size, voltage, whatever's relevant? Be specific."},
 {t:"Who did what", q:"Who else was there? What did you do yourself, and what did somebody else do?"},
 {t:"When it went wrong", q:"Tell me about a time this job didn't go to plan. What happened, and what did you do about it?"},
 {t:"Before you start", q:"What do you check before you start? What would make you stop and not proceed?"},
 {t:"Supervision", q:"Were you working on your own, signed off by someone, or being directed? This is the question assessors care most about."}
];

var recs = [];      // {id,title,cue,blob,url,mime,kind,secs,transcript,when}
var seq = 0;
var cur = "before";
var media = null, chunks = [], timer = null, t0 = 0, stream = null;
var recog = null, recogText = "", recogOn = false;
var mode = "audio";
var cueIx = 0;

var $ = function(id){ return document.getElementById(id); };
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function clock(s){ return pad(Math.floor(s/60))+":"+pad(s%60); }
function today(){ return new Date().toISOString().slice(0,10); }

var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* MP4 only. MediaRecorder writes MP4 in Chrome and Safari; Firefox writes
   WebM and nothing else. Converting in the browser would mean shipping a
   transcoder of tens of megabytes, which would defeat the point of a
   single file that runs offline — so where MP4 isn't available we say so
   plainly rather than quietly handing back a WebM. */
var MP4_VIDEO = [
  'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
  'video/mp4;codecs=avc1,mp4a.40.2',
  'video/mp4;codecs=h264,aac',
  'video/mp4'
];
var MP4_AUDIO = [
  'audio/mp4;codecs="mp4a.40.2"',
  'audio/mp4;codecs=mp4a.40.2',
  'audio/mp4',
  'audio/aac'
];

function mp4Type(kind){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
  var list = kind === "video" ? MP4_VIDEO : MP4_AUDIO;
  for(var i=0;i<list.length;i++){
    if(MediaRecorder.isTypeSupported(list[i])) return list[i];
  }
  return null;
}
var CAN = {audio: mp4Type("audio"), video: mp4Type("video")};

/* ---------------- recording ---------------- */
async function start(){
  try{
    stream = await navigator.mediaDevices.getUserMedia(
      mode === "video" ? {audio:true, video:{width:{ideal:1280}}} : {audio:true});
  }catch(e){
    alert("Couldn't get the microphone" + (mode==="video"?" or camera":"") +
      ". Check the browser has permission, and that nothing else is using it.");
    return;
  }
  chunks = []; recogText = "";
  var mime = CAN[mode];
  if(!mime){
    stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
    alert("This browser can't record MP4. Use Chrome or Safari, or record on your phone and bring the file in.");
    return;
  }
  media = new MediaRecorder(stream, {mimeType: mime});
  media.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
  media.onstop = finish;
  media.start();

  if(recogOn && SR) startRecog();

  t0 = Date.now();
  timer = setInterval(function(){
    var el = $("clock"); if(el) el.textContent = clock(Math.floor((Date.now()-t0)/1000));
  }, 500);
  render();
}

function startRecog(){
  try{
    recog = new SR();
    recog.continuous = true; recog.interimResults = true; recog.lang = "en-AU";
    recog.onresult = function(e){
      var fin = "";
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) fin += e.results[i][0].transcript;
      }
      if(fin) recogText += fin;
      var el = $("livetext");
      if(el) el.textContent = recogText || "listening…";
    };
    recog.onerror = function(){};
    recog.onend = function(){ if(media && media.state === "recording"){ try{ recog.start(); }catch(e){} } };
    recog.start();
  }catch(e){ recog = null; }
}

function stop(){
  if(media && media.state !== "inactive") media.stop();
  if(recog){ try{ recog.onend = null; recog.stop(); }catch(e){} recog = null; }
  clearInterval(timer); timer = null;
}

function finish(){
  var secs = Math.floor((Date.now()-t0)/1000);
  var blob = new Blob(chunks, {type: media.mimeType || (mode==="video"?"video/mp4":"audio/mp4")});
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  seq++;
  recs.push({
    id: "EV-" + pad(seq),
    title: CUES[cueIx] ? CUES[cueIx].t : "Spoken evidence",
    cue: CUES[cueIx] ? CUES[cueIx].q : "",
    blob: blob, url: URL.createObjectURL(blob),
    mime: blob.type, kind: mode,
    secs: secs, transcript: recogText.trim(), when: today(),
    dictated: !!(recogOn && SR && recogText.trim())
  });
  media = null;
  cur = "items";
  render();
}

/* ---------------- export ---------------- */
function ext(r){ return r.kind === "video" ? "mp4" : "m4a"; }
function fileName(r){ return r.id + "-" + r.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "." + ext(r); }

function dl(blob, name){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}

function buildIndex(){
  var L = [];
  L.push("# Evidence index — spoken and filmed evidence");
  L.push("");
  L.push("Recorded by the candidate, on the candidate's own device. **These recordings are not anonymous and cannot be made anonymous** — a voice is identifying, and a face more so. They are supplied directly to the assessor.");
  L.push("");

  var dict = recs.filter(function(r){ return r.dictated; });
  if(dict.length){
    L.push("**Speech recognition was used on " + dict.length + " of " + recs.length + " item" +
      (recs.length === 1 ? "" : "s") + "** (" + dict.map(function(r){ return r.id; }).join(", ") +
      ") to produce a first-pass transcript. That sends the audio to the browser vendor's service. " +
      "No language model was used, and no wording was generated, suggested or rephrased by software — " +
      "the words are the candidate's own, corrected by the candidate against the recording.");
  } else {
    L.push("**No AI and no speech recognition were used.** The recordings were not sent to any service, and every transcript was typed by the candidate while listening back. The words are entirely the candidate's own.");
  }
  L.push("");
  L.push("All files are MP4 \u2014 `.mp4` for video, `.m4a` for MP4 audio. No proprietary or browser-specific formats.");
  L.push("");
  L.push("| Item | Topic | Format | Length | Recorded | Transcript |");
  L.push("|---|---|---|---|---|---|");
  recs.forEach(function(r){
    L.push("| " + r.id + " | " + r.title + " | " + (r.kind === "video" ? "MP4 video" : "MP4 audio") + " | " + clock(r.secs) + " | " + r.when +
           " | " + (r.transcript ? "supplied" : "**none — audio only**") + " |");
  });
  L.push("");
  L.push("---");
  L.push("");
  recs.forEach(function(r){
    L.push("## " + r.id + " — " + r.title);
    L.push("");
    L.push("- File: `" + fileName(r) + "`");
    L.push("- Recorded: " + r.when + " · " + clock(r.secs) + " · " + (r.kind === "video" ? "MP4 video" : "MP4 audio"));
    if(r.cue){ L.push("- Question answered: " + r.cue); }
    L.push("- Transcript produced by: " + (r.dictated
      ? "speech recognition, corrected by the candidate"
      : "the candidate, typed from the recording"));
    L.push("");
    L.push("**Transcript**");
    L.push("");
    L.push(r.transcript ? r.transcript : "_No transcript. The recording must be listened to._");
    L.push("");
    L.push("> Transcript accuracy is the candidate's responsibility. Where the transcript and the recording differ, **the recording is the evidence.**");
    L.push("");
  });
  L.push("---");
  L.push("");
  L.push("**Authenticity.** These recordings are the candidate's own account of their own work. They are [S] evidence — stated by the candidate — not [D] documentary evidence, and not third-party verified. An assessor should treat them as they would a competency conversation: useful for probing and clarifying, and requiring corroboration where a claim is material.");
  return L.join("\n");
}

/* ---------------- views ---------------- */
function renderRail(){
  var r = $("rail"); r.innerHTML = "";
  function item(id, code, name, sub){
    var b = document.createElement("button");
    b.className = "stg";
    b.setAttribute("aria-current", cur===id?"true":"false");
    b.innerHTML = '<span class="id">'+esc(code)+'</span><span class="nm">'+esc(name)+
      '<span class="sub">'+esc(sub)+'</span></span>';
    b.onclick = function(){ if(media) return; cur = id; render(); };
    r.appendChild(b);
  }
  var l1 = document.createElement("div"); l1.className="raillabel"; l1.textContent="Before you record";
  r.appendChild(l1);
  item("before","!","Read this first","Consent and privacy");

  var l2 = document.createElement("div"); l2.className="raillabel"; l2.textContent="Record";
  r.appendChild(l2);
  item("record","\u25CF","New recording","Answer one question");

  var l3 = document.createElement("div"); l3.className="raillabel"; l3.textContent="Then";
  r.appendChild(l3);
  item("items","\u25A4","Your recordings", recs.length ? recs.length + " saved" : "none yet");
  item("export","\u2193","Evidence index","For the assessor");
}

function renderBefore(m){
  m.innerHTML = "<h2>Read this first</h2><p class='lede'>Talking through a job is often better evidence than writing it up — you'll say things you'd never think to type. But recordings carry risks that written evidence doesn't.</p>";

  var g1 = document.createElement("div"); g1.className="gate";
  g1.innerHTML = "<b>A recording cannot be made anonymous.</b> Your voice identifies you, and your face more so. Nothing here goes through Isolation, and nothing here should be pasted into an AI chat. The recordings go <b>directly to your assessor</b>. Only the typed transcript can go through Isolation and be used elsewhere.";
  m.appendChild(g1);

  var g2 = document.createElement("div"); g2.className="gate";
  g2.innerHTML = "<b>Before you record at a workplace, get permission.</b> Many sites prohibit cameras and recording devices outright. You may capture other people's voices or faces, which is their privacy, not yours to give away. You may capture commercially sensitive plant, processes or layouts. <b>Ask your employer first</b> — a recording that breaches a site rule is a problem for you long after the RPL is finished.";
  m.appendChild(g2);

  var n = document.createElement("div"); n.className="note";
  n.innerHTML = "<b>Safest approach:</b> record yourself talking about the work somewhere off-site, rather than filming the work itself. A clear spoken account of what you did, how often, and under what supervision is worth more to an assessor than shaky footage of a gearbox.";
  m.appendChild(n);

  var n2 = document.createElement("div"); n2.className="note";
  n2.innerHTML = "<b>What this is worth as evidence.</b> A recording of you describing your own work is your own statement — the same weight as telling an assessor in person. It is not documentary proof and it is not third-party verified. It's strong for showing depth of understanding and for answering the questions a portfolio can't. Expect an assessor to still want corroboration for anything material.";
  m.appendChild(n2);

  var n3 = document.createElement("div"); n3.className="good";
  n3.innerHTML = "<b>Nothing leaves this machine</b> unless you switch on live transcription \u2014 see the note on the recording page, because that one does send audio away.";
  m.appendChild(n3);

  var n4 = document.createElement("div"); n4.className = (CAN.audio || CAN.video) ? "note" : "gate";
  n4.innerHTML = (CAN.audio || CAN.video)
    ? "<b>Everything saves as MP4</b> \u2014 <b>.mp4</b> for video, <b>.m4a</b> for audio. Both open anywhere without special software, which matters when the file has to travel through an RTO's systems."
    : "<b>This browser can't record MP4, so recording is turned off.</b> Open this page in Chrome or Safari, or use your phone's camera or voice recorder \u2014 both save MP4 already.";
  m.appendChild(n4);

  var r = document.createElement("div"); r.className="row";
  var b = document.createElement("button");
  b.className="act primary"; b.textContent="I've read this — start recording";
  b.onclick = function(){ cur="record"; render(); };
  r.appendChild(b);
  m.appendChild(r);
}

function renderRecord(m){
  m.innerHTML = "<h2>New recording</h2><p class='lede'>Pick a question, hit record, and answer it out loud like you're talking to another tradesperson. One question per recording keeps it useful for the assessor.</p>";

  var recording = !!(media && media.state === "recording");

  if(!CAN.audio && !CAN.video){
    var blk = document.createElement("div"); blk.className = "gate";
    blk.innerHTML = "<b>This browser can't record MP4.</b> Everything here is saved as MP4 so your assessor can open it without special software \u2014 and Firefox only writes WebM, which many players and learning systems reject.<br><br>" +
      "<b>What to do:</b> open this page in Chrome or Safari, or record on your phone's own camera or voice recorder app (both produce MP4) and send those files to your assessor with a typed transcript.";
    m.appendChild(blk);
    return;
  }

  if(!recording){
    var l = document.createElement("label"); l.className="fl"; l.textContent="What are you answering?";
    m.appendChild(l);
    var sel = document.createElement("select");
    CUES.forEach(function(c,i){
      var o = document.createElement("option"); o.value=i; o.textContent=c.t; sel.appendChild(o);
    });
    sel.value = cueIx;
    sel.onchange = function(){ cueIx = +sel.value; render(); };
    m.appendChild(sel);
  }

  var cue = document.createElement("div"); cue.className="cue";
  cue.innerHTML = '<div class="n">Question '+(cueIx+1)+' of '+CUES.length+'</div>'+
    '<p class="q">'+esc(CUES[cueIx].q)+'</p>';
  m.appendChild(cue);

  var bar = document.createElement("div");
  bar.className = "recbar" + (recording ? " on" : "");
  bar.innerHTML = '<span class="dot"></span><span class="clock" id="clock">'+
    (recording ? "00:00" : "00:00")+'</span><span class="st">'+
    (recording ? "Recording — take your time" : "Ready") + "</span>";
  m.appendChild(bar);

  var fmt = document.createElement("div"); fmt.className = "good";
  fmt.innerHTML = "<b>Saves as MP4.</b> " +
    (mode === "video"
      ? (CAN.video ? "Video records to <b>.mp4</b> (H.264 + AAC)." : "Video MP4 isn't available in this browser \u2014 audio only.")
      : (CAN.audio ? "Audio records to <b>.m4a</b>, which is MP4 audio." : "Audio MP4 isn't available in this browser.")) +
    " Assessors and learning systems open these without special software.";
  m.appendChild(fmt);

  var r = document.createElement("div"); r.className="row";
  if(!recording){
    ["audio","video"].forEach(function(k){
      var b = document.createElement("button");
      b.className = "act" + (mode===k ? " primary" : "");
      b.textContent = k === "audio" ? "Audio only" : "Audio + video";
      b.disabled = !CAN[k];
      b.title = CAN[k] ? "" : "This browser can't record MP4 " + k;
      b.onclick = function(){ mode = k; render(); };
      r.appendChild(b);
    });
    var go = document.createElement("button");
    go.className="act rec";
    go.textContent = "● Start recording";
    go.disabled = !CAN[mode];
    go.onclick = start;
    r.appendChild(go);
  } else {
    var sp = document.createElement("button");
    sp.className="act primary"; sp.textContent="■ Stop and save";
    sp.onclick = stop;
    r.appendChild(sp);
  }
  m.appendChild(r);

  if(!recording){
    var tg = document.createElement("div"); tg.className = SR ? "note" : "note";
    if(SR){
      tg.innerHTML = '<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">'+
        '<input type="checkbox" id="sr" '+(recogOn?"checked":"")+' style="width:auto;margin-top:3px">'+
        '<span><b>Transcribe as I speak.</b> Saves typing, but your browser sends the audio to its vendor to do it — Google for Chrome, Apple for Safari. Leave it off and type the transcript yourself afterwards; the recording itself never leaves this machine either way.</span></label>';
      m.appendChild(tg);
      var cb = tg.querySelector("#sr");
      cb.onchange = function(){ recogOn = cb.checked; };
    } else {
      tg.innerHTML = "<b>Live transcription isn't available in this browser.</b> Record anyway — you'll type the transcript afterwards, which is more accurate and keeps the audio entirely on this machine.";
      m.appendChild(tg);
    }
  }

  if(recording && recogOn && SR){
    var lt = document.createElement("div"); lt.className="note";
    lt.innerHTML = '<b>Live transcript</b><br><span id="livetext">listening…</span>';
    m.appendChild(lt);
  }
}

function renderItems(m){
  m.innerHTML = "<h2>Your recordings</h2><p class='lede'>Check each transcript against what you actually said, then download. <b>Nothing here survives closing the tab</b> — download as you go.</p>";

  if(!recs.length){
    var e = document.createElement("div"); e.className="empty";
    e.textContent = "No recordings yet.";
    m.appendChild(e);
    return;
  }

  recs.forEach(function(r,i){
    var it = document.createElement("div"); it.className="item";
    var h = document.createElement("div"); h.className="ihead";
    h.innerHTML = '<div><div class="iid">'+r.id+'</div><div class="ititle">'+esc(r.title)+'</div>'+
      '<div class="imeta">'+r.kind+' · '+clock(r.secs)+' · '+r.when+'</div>'+
      '<div style="margin-top:7px"><span class="pill '+(r.transcript?"ok":"no")+'">'+
      (r.transcript?"transcript supplied":"no transcript")+'</span>'+
      (r.dictated?' <span class="pill">speech recognition used</span>':'')+
      '</div></div>';
    var bt = document.createElement("div"); bt.className="ibtns";
    var d = document.createElement("button");
    d.className="act primary"; d.textContent="Download";
    d.onclick = function(){ dl(r.blob, fileName(r)); };
    bt.appendChild(d);
    var x = document.createElement("button");
    x.className="act"; x.textContent="Delete";
    x.onclick = function(){ URL.revokeObjectURL(r.url); recs.splice(i,1); render(); };
    bt.appendChild(x);
    h.appendChild(bt);
    it.appendChild(h);

    var b = document.createElement("div"); b.className="ibody";
    var pl = document.createElement(r.kind === "video" ? "video" : "audio");
    pl.controls = true; pl.src = r.url;
    b.appendChild(pl);

    var l = document.createElement("label"); l.className="fl";
    l.textContent = r.transcript ? "Transcript — fix anything it got wrong" : "Transcript — type what you said";
    b.appendChild(l);
    var ta = document.createElement("textarea");
    ta.rows = 5; ta.value = r.transcript;
    ta.placeholder = "Play it back and type what you said. Plain words, exactly as you said them — don't tidy it up.";
    ta.oninput = function(){ r.transcript = ta.value; };
    ta.onblur = function(){ render(); };
    b.appendChild(ta);
    it.appendChild(b);
    m.appendChild(it);
  });
}

function renderExport(m){
  m.innerHTML = "<h2>Evidence index</h2><p class='lede'>A cover document listing every recording, with transcripts, ready to go to your assessor alongside the media files themselves.</p>";

  if(!recs.length){
    var e = document.createElement("div"); e.className="empty"; e.textContent="Nothing to export yet.";
    m.appendChild(e); return;
  }

  var noT = recs.filter(function(r){ return !r.transcript.trim(); }).length;
  if(noT){
    var g = document.createElement("div"); g.className="gate";
    g.innerHTML = "<b>"+noT+" recording"+(noT===1?" has":"s have")+" no transcript.</b> The index will say so, and the assessor will have to listen to "+(noT===1?"it":"them")+" in full. A transcript makes their job faster and lets the text be mapped against unit requirements — the audio can't be.";
    m.appendChild(g);
  }

  var n = document.createElement("div"); n.className="note";
  n.innerHTML = "<b>Send the media files too.</b> The index names each file but doesn't contain it. Download each recording from Your recordings, and send them together with this index.";
  m.appendChild(n);

  var r2 = document.createElement("div"); r2.className="row";
  var d = document.createElement("button");
  d.className="act primary"; d.textContent="Download index (.md)";
  d.onclick = function(){ dl(new Blob([buildIndex()],{type:"text/markdown;charset=utf-8"}), "evidence-index-"+today()+".md"); };
  r2.appendChild(d);

  var da = document.createElement("button");
  da.className="act"; da.textContent="Download all recordings";
  da.onclick = function(){
    recs.forEach(function(r,i){ setTimeout(function(){ dl(r.blob, fileName(r)); }, i*400); });
  };
  r2.appendChild(da);

  var c = document.createElement("button");
  c.className="act"; c.textContent="Copy index";
  c.onclick = function(){
    var t = buildIndex();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){
        c.textContent="Copied"; c.classList.add("copied");
        setTimeout(function(){ c.textContent="Copy index"; c.classList.remove("copied"); },1600);
      });
    }
  };
  r2.appendChild(c);
  m.appendChild(r2);

  var g2 = document.createElement("div"); g2.className="good";
  g2.innerHTML = "<b>Add the item numbers to your handover pack.</b> In the Candidate Toolbox, reference these by their EV numbers where a claim relies on one — so the assessor can match a claim to the recording that supports it.";
  m.appendChild(g2);

  var pre = document.createElement("pre");
  pre.textContent = buildIndex();
  m.appendChild(pre);
}

function render(){
  renderRail();
  var m = $("main");
  if(cur === "before") renderBefore(m);
  else if(cur === "record") renderRecord(m);
  else if(cur === "items") renderItems(m);
  else renderExport(m);
}

window.addEventListener("beforeunload", function(e){
  if(recs.length){ e.preventDefault(); e.returnValue = ""; }
});

render();
})();
</script>
</body>
</html>
